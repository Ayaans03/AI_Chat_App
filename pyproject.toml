[project]
name = "ai-chat-app"
version = "0.1.0"
description = ""

readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "google-genai[aiohttp] (>=2.14.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)"
]

[tool.poetry]
packages = [{include = "ai_chat_app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.14,<3.14.1 || >3.14.1"

[virtualenvs]
in-project = true